id: 414
name: "تقييم الاستراتيجية (Strategy Evaluation)"
version: "1.0.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"
metadata:
  category: "Strategy"
  note: "⚠️ market.outcome.realized افتراضي — يحتاج قسم 550/700 غير مبنيين، نفس قيد 360"
dependencies: []
publishes: ["strategy.evaluation_updated"]
subscribes: ["strategy.entry_confirmed", "market.outcome.realized"]
startup_mode: auto
health: {interval_ms: 30000, timeout_ms: 5000, failure_threshold: 3, restart_on_failure: false, max_restarts: 3, restart_backoff_ms: 1000}
config_schema: 
  type: object
  properties: 
    accuracy_precision:
      type: integer
      minimum: 1
      maximum: 8
      default: 4
  additionalProperties: false
config: 
  accuracy_precision: 4