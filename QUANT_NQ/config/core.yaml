# إعداد Core العام فقط — لا يحتوي أي إعداد خاص بذرة بعينها (المادة 8/95).
log_level: INFO
log_json: true
atoms_root: atoms

journal:
  path: var/journal.jsonl

discovery:
  # دورية الفحص الحي لمجلد الذرات (المادة 14).
  rescan_interval_s: 5.0

api:
  enable_dashboard: true
  host: 127.0.0.1
  port: 8000
  # api_key: "ضع-مفتاحًا-هنا"  ← إلزامي عمليًا لأي host غير 127.0.0.1

secrets:
  # مخزن الأسرار خارج النواة تماماً. عطّله بـ enabled: false فتعمل
  # النواة كما هي دون أي أثر.
  enabled: true
  vault_path: runtime/secrets.enc
  # allow_prompt: false للخدمات غير التفاعلية (تعتمد DPAPI أو البيئة)
  allow_prompt: false
  env_prefix: QUANT_SECRET_
